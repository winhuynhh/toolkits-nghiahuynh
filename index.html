<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nghĩa Huỳnh · Toolkit</title>
<meta name="description" content="Bộ công cụ cá nhân — mọi tool ở một nơi." />

<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#5b52e0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NH Toolkit" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">NH</span>
    <span class="brand-text">Nghĩa Huỳnh</span>
  </div>
  <div class="header-actions">
    <button class="edit-toggle" id="editToggle" type="button">
      <span id="editToggleIcon">✎</span>
      <span id="editToggleLabel">Sửa</span>
    </button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Đổi giao diện sáng/tối">
      <span id="themeIcon">☀</span>
    </button>
  </div>
</header>

<section class="hero-panel">
  <div class="hero-inner">
    <p class="badge-pill"><span class="badge-dot"></span>Bộ công cụ cá nhân</p>
    <h1>Nghĩa Huỳnh <span class="accent">Toolkit</span></h1>
    <p class="hero-sub">Tất cả tool tự build, gom về một chỗ. Bấm <strong>+</strong> để thêm tool mới.</p>

    <div class="command-bar">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="searchInput"
        type="text"
        placeholder="Tìm tool… (vd: flashcard, ký, yến)"
        autocomplete="off"
        spellcheck="false"
      />
      <span class="hint" id="resultCount"></span>
    </div>

    <div class="chips" id="categoryChips"></div>
  </div>
</section>

<main>
  <section class="list" id="toolGrid" aria-live="polite"></section>

  <div class="skeleton-list" id="skeletonGrid">
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
  </div>

  <div class="empty-state" id="emptyState" hidden>
    <p id="emptyTitle">Chưa có tool nào</p>
    <p class="empty-sub" id="emptySub">Bấm nút <strong>+</strong> ở góc dưới để thêm tool đầu tiên.</p>
    <button type="button" id="clearFilters" hidden>Bỏ lọc</button>
  </div>

  <p class="load-error" id="loadError" hidden>
    Không tải được danh sách tool. <button type="button" id="retryLoad">Thử lại</button>
  </p>
</main>

<footer>
  <span id="footerCount"></span>
</footer>

<button class="fab" id="fabAdd" type="button" aria-label="Thêm tool mới" hidden>+</button>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Thêm tool mới</h2>
      <button type="button" class="modal-close" id="modalClose" aria-label="Đóng">✕</button>
    </div>

    <form id="toolForm" class="tool-form">
      <label>
        <span>Tên tool <em>*</em></span>
        <input type="text" name="name" required maxlength="80" placeholder="VD: Flashcard Việt–Anh" />
      </label>

      <label>
        <span>Link <em>*</em></span>
        <input type="url" name="url" required maxlength="500" placeholder="https://..." />
      </label>

      <div class="form-row">
        <label>
          <span>Icon (link ảnh app)</span>
          <input type="text" name="icon" maxlength="300" placeholder="https://... — bỏ trống để tự tạo avatar chữ" />
        </label>
        <label>
          <span>Nhóm</span>
          <input type="text" name="category" maxlength="40" placeholder="VD: Học tập" />
        </label>
      </div>

      <label>
        <span>Mô tả ngắn</span>
        <input type="text" name="description" maxlength="200" placeholder="1 dòng mô tả tool làm gì" />
      </label>

      <p class="form-error" id="formError" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="submitBtn">Thêm tool</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="passwordOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
    <div class="modal-head">
      <h2 id="passwordTitle">Mở khoá chỉnh sửa</h2>
      <button type="button" class="modal-close" id="passwordClose" aria-label="Đóng">✕</button>
    </div>

    <form id="passwordForm" class="tool-form">
      <label>
        <span>Mật khẩu quản trị</span>
        <input type="password" name="password" required autocomplete="off" placeholder="••••••••" />
      </label>

      <p class="form-error" id="passwordError" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn-primary" id="passwordSubmitBtn">Mở khoá</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
